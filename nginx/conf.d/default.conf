# HTTP → HTTPS
server {
    listen 80;
    server_name cipherbrush.ru www.cipherbrush.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name cipherbrush.ru www.cipherbrush.ru;

    ssl_certificate /etc/nginx/ssl/live/cipherbrush.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/cipherbrush.ru/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 100M;  # Разрешаем загрузку файлов до 100MB
        proxy_pass http://gateway:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;  # Отключаем буферизацию для больших файлов
        proxy_read_timeout 300s;  # Увеличиваем таймаут для больших загрузок
    }
}
