version: '3.8'

services:
  # УДАЛИТЬ или ЗАМЕНИТЬ эти два сервиса:
  # certbot: ← УДАЛИТЬ
  # certbot-renew: ← УДАЛИТЬ

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  auth-service:
    build: ./auth_service
    command: python manage.py runserver 0.0.0.0:8001
    env_file: .env
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - app-network

  painting-service:
    build: ./painting_service
    command: python manage.py runserver 0.0.0.0:8002
    env_file: .env
    depends_on:
      - postgres
      - image-processing-service
    restart: unless-stopped
    networks:
      - app-network

  catalog-service:
    build: ./catalog_service
    command: python manage.py runserver 0.0.0.0:8003
    env_file: .env
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - app-network

  image-processing-service:
    build: ./image_processing_service
    command: python manage.py runserver 0.0.0.0:8004
    restart: unless-stopped
    networks:
      - app-network

  gateway:
    build: ./api_gateway
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    depends_on:
      - auth-service
      - painting-service
      - catalog-service
      - image-processing-service
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks:
      - app-network

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/nginx/ssl
    depends_on:
      - frontend
      - gateway
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge